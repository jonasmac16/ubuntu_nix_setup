# Every host below is ansible_connection=local — the playbook NEVER connects
# over the network; each entry targets the local machine only.
# Run with:  ansible-playbook ... -l "$(hostname)"
# to converge ONLY the current machine. Entry names MUST match the output of
# `hostname` on each box so the selection is automatic.
#
# Add one entry per physical machine, in the group matching its role.

[workstations]
workstation-orcrb ansible_host=localhost ansible_connection=local

[laptops]
laptop-xps ansible_host=localhost ansible_connection=local

[ubuntu:children]
workstations
laptops

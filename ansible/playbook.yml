        #     name: "{{ item }}"
        #     enabled: true
        #     state: started
        #   loop: [mnt-nas-nfs.automount, mnt-nas-smb.automount]

        - name: Activate laptop battery preservation layers
          ansible.builtin.systemd:
            name: tlp
            enabled: true
            state: started
          when: is_laptop | bool

        # ====================================================
        # REMOTE SERVICES (SSH, CORPORATE VPN, MESH NETWORK, STORAGE CLIENTS)
        # ====================================================
        - name: Install secure remote shell server
          ansible.builtin.apt:
            name: openssh-server
            update_cache: true
            state: present

        - name: Enable SSH daemon
          ansible.builtin.systemd:
            name: ssh
            enabled: true
            state: started

        - name: Install corporate VPN client (NetworkManager openconnect)
          ansible.builtin.apt:
            name:
              - network-manager-openconnect
              - network-manager-openconnect-gnome
            state: present

        - name: Check for central AnyConnect VPN profile
          ansible.builtin.command:
            argv:
              - nmcli
              - --terse
              - --fields
              - NAME
              - connection
              - show
              - AnyConnect
          register: anyconnect_profile
          changed_when: false
          failed_when: false

        - name: Create central AnyConnect VPN profile
          ansible.builtin.command:
            argv:
              - nmcli
              - connection
              - add
              - type
              - vpn
              - vpn-type
              - openconnect
              - con-name
              - AnyConnect
              - ifname
              - "*"
              - vpn.data
              - "gateway = {{ vault_anyconnect_gateway }}, useragent = {{ vault_anyconnect_user_agent }}"
          no_log: true
          when: anyconnect_profile.rc != 0

        - name: Reconcile central AnyConnect VPN profile settings
          ansible.builtin.command:
            argv:
              - nmcli
              - connection
              - modify
              - AnyConnect
              - vpn.data
              - "gateway = {{ vault_anyconnect_gateway }}, useragent = {{ vault_anyconnect_user_agent }}"
          no_log: true
          changed_when: false

        - name: Install Tailscale mesh client
          ansible.builtin.shell: "curl -fsSL https://tailscale.com/install.sh | sh"
          args:
            creates: /usr/bin/tailscale

        - name: Enable tailscaled mesh service
          ansible.builtin.systemd:
            name: tailscaled
            enabled: true
            state: started

        - name: Query Tailscale connection status
          ansible.builtin.command: tailscale status
          register: tailscale_status
          changed_when: false
          ignore_errors: true

        - name: Join existing Tailscale tailnet
          ansible.builtin.shell: |
            tailscale up --authkey="{{ vault_tailscale_authkey }}" --hostname="{{ inventory_hostname }}"
          when: tailscale_status.rc != 0 and (vault_tailscale_authkey | default('')) | length > 0

        - name: Provision network share client utilities
          ansible.builtin.apt:
            name:
              - cifs-utils
              - nfs-common
            state: present

        # ====================================================
        # ENDPOINT PROTECTION (EDR) — guarded on vendor/ files
        # ====================================================
        # Drop the Tanium .deb + tanium-init.dat and Sophos SophosSetup.sh into
        # vendor/ (gitignored) to opt a host in. Tasks are skipped when the
        # files are absent, so the repo stays portable.
        - name: Inspect Tanium client bundle
          ansible.builtin.stat:
            path: "{{ playbook_dir }}/vendor/tanium-init.dat"
          register: tanium_initfile

        - name: Stage Tanium client package from vendor
          ansible.builtin.apt:
            deb: "{{ item }}"
            state: present
          loop: "{{ lookup('fileglob', playbook_dir + '/vendor/taniumclient_*.deb') }}"
          when: tanium_initfile.stat.exists

        - name: Deploy Tanium client instance mask
          ansible.builtin.copy:
            src: "{{ playbook_dir }}/vendor/tanium-init.dat"
            dest: "/opt/Tanium/TaniumClient/tanium-init.dat"
            mode: '0644'
          when: tanium_initfile.stat.exists

        - name: Inspect Sophos installer bundle
          ansible.builtin.stat:
            path: "{{ playbook_dir }}/vendor/SophosSetup.sh"
          register: sophos_installer

        - name: Install Sophos Protection for Linux (interactive)
          ansible.builtin.shell: "sh {{ playbook_dir }}/vendor/SophosSetup.sh"
          args:
            chdir: "{{ playbook_dir }}/vendor"
          when: sophos_installer.stat.exists
          changed_when: false

    # ====================================================
    # SECTION B: USER SPACE APPLICATION CONFIGURATION (become: false)
    # ====================================================
    - name: Run tasks under user context
      become: false
      block:
        - name: Ensure target .ssh folder contains valid system masks
          ansible.builtin.file:
            path: "{{ ansible_env.HOME }}/.ssh"
            state: directory
            mode: '0700'

        - name: Resolve per-host SSH key material from Vault
          ansible.builtin.set_fact:
            host_ssh_private_key: "{{ (vault_host_ssh_private_keys | default({}))[inventory_hostname] | default(vault_ssh_private_key | default('')) }}"
            host_ssh_public_key: "{{ (vault_host_ssh_public_keys | default({}))[inventory_hostname] | default('') }}"

        - name: Map user secure private encryption keys from Vault
          ansible.builtin.copy:
            dest: "{{ ansible_env.HOME }}/.ssh/id_ed25519"
            content: "{{ host_ssh_private_key }}"
            mode: '0600'
          when: host_ssh_private_key | length > 0

        - name: Map user secure public encryption keys from Vault
          ansible.builtin.copy:
            dest: "{{ ansible_env.HOME }}/.ssh/id_ed25519.pub"
            content: "{{ host_ssh_public_key }}"
            mode: '0644'
          when: host_ssh_public_key | length > 0

        - name: Ensure SSH config drop-in directory exists
          ansible.builtin.file:
            path: "{{ ansible_env.HOME }}/.ssh/config.d"
            state: directory
            mode: '0700'

        - name: Deploy SSH host definitions from Vault
          ansible.builtin.template:
            src: ssh_config_hosts.j2
            dest: "{{ ansible_env.HOME }}/.ssh/config.d/10-vault-hosts"
            mode: '0600'

        - name: Construct user profile binary path anchors
          ansible.builtin.file:
            path: "{{ ansible_env.HOME }}/.local/bin"
            state: directory
            mode: '0755'

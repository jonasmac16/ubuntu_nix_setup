---
- name: Converge System and Hardware Environment Locally
  hosts: ubuntu
  gather_facts: true

  tasks:
    # ====================================================
    # SECTION A: PRIVILEGED CORE PROVISIONING (become: true)
    # ====================================================
    - name: Execute system configuration blocks requiring root access
      become: true
      block:
        - name: Update apt index cache and pull core display components
          ansible.builtin.apt:
            name: [sway, swaylock, swayidle, xwayland, seatd, dbus-x11, network-manager]
            state: present
            update_cache: true

        - name: Install host-specific system packages
          ansible.builtin.apt:
            name: "{{ additional_packages }}"
            state: present
          when: additional_packages | length > 0

        - name: Enable NetworkManager for nmcli-managed profiles
          ansible.builtin.systemd:
            name: NetworkManager
            enabled: true
            state: started

        - name: Provision native proprietary graphics drivers
          ansible.builtin.apt:
            name: nvidia-driver-595
            state: present
          when: install_nvidia | bool

        - name: Configure PipeWire for Wayland native audio management
          ansible.builtin.apt:
            name: [pipewire, pipewire-pulse, wireplumber]
            state: present

        - name: Install Wayland desktop system daemons (Bluetooth, disks, polkit)
          ansible.builtin.apt:
            name: [bluez, udisks2, polkitd]
            state: present
            update_cache: true

        - name: Enable Bluetooth daemon
          ansible.builtin.systemd:
            name: bluetooth
            enabled: true
            state: started

        - name: Enable disk automount daemon (used by udiskie in the user session)
          ansible.builtin.systemd:
            name: udisks2
            enabled: true
            state: started

        - name: Enable polkit authorization daemon (used by the polkit-gnome agent)
          ansible.builtin.systemd:
            name: polkit
            enabled: true
            state: started

        - name: Bind user account to critical hardware execution groups
          ansible.builtin.user:
            name: "{{ ansible_env.USER if ansible_env.USER != 'root' else ansible_user }}"
            append: true
            groups: [video, input]

        - name: Launch local hardware session daemon
          ansible.builtin.systemd:
            name: seatd
            enabled: true
            state: started

        - name: Configure local home wireless network profiles
          community.general.nmcli:
            conn_name: "Home-WiFi"
            type: wifi
            ssid: "{{ vault_home_wifi_ssid }}"
            wifi_sec:
              key-mgmt: wpa-psk
              psk: "{{ vault_home_wifi_password }}"
            autoconnect_priority: 10 # prefer Home-WiFi when work is also in range
            state: present

        - name: Configure local work wireless network profiles
          community.general.nmcli:
            conn_name: "Work-WiFi"
            type: wifi
            ssid: "{{ vault_work_wifi_ssid }}"
            wifi_sec:
              key-mgmt: wpa-psk
              psk: "{{ vault_work_wifi_password }}"
            state: present

        - name: Setup lightweight display manager gateway
          ansible.builtin.apt:
            name: [greetd, cage]
            state: present

        - name: Deploy greetd direct console bypass loop
          ansible.builtin.copy:
            dest: /etc/greetd/config.toml
            mode: '0644'
            content: |
              [terminal]
              vt = 1
              [default_session]
              command = "cage agreety --cmd sway"
              user = "greeter"

        - name: Enable display daemon boot target hooks
          ansible.builtin.systemd:
            name: greetd
            enabled: true
            state: restarted

